# Optional: connect to an existing PostgreSQL with one connection string.
services:
  app:
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env, e.g. postgresql://user:pass@host:5432/zhu_jia?sslmode=verify-full}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes: !reset []
