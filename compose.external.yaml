# Standalone/managed PostgreSQL; no application data volume is used.
services:
  app:
    environment:
      DATABASE_URL: ""
      PGHOST: ${POSTGRES_HOST:?Set POSTGRES_HOST for the external database}
      PGPORT: ${POSTGRES_PORT:-5432}
      PGDATABASE: ${POSTGRES_DB:-zhu_jia}
      PGUSER: ${POSTGRES_USER:-zhu_jia}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGSSLMODE: ${POSTGRES_SSLMODE:-prefer}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes: !reset []
