name: zhu-jia-web
services:
  app:
    image: zhu-jia-web:0.9.14
    build: .
    init: true
    restart: unless-stopped
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env to the browser-facing origin}
      DATABASE_URL: /app/data/postgres
    ports:
      - "127.0.0.1:8080:3001"
    volumes:
      - app_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  app_data:
