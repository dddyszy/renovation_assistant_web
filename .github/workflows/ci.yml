name: Verify 0.9.17
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    strategy:
      matrix:
        postgres: [18, 17]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_DB: zhu_jia_test
          POSTGRES_USER: zhu_jia
          POSTGRES_PASSWORD: ci-test-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U zhu_jia -d zhu_jia_test" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Prepare disposable migration target
        run: node --input-type=module -e "import pg from 'pg'; const pool=new pg.Pool({connectionString:process.env.TEST_DATABASE_URL}); try { await pool.query('CREATE DATABASE zhu_jia_migration') } finally { await pool.end() }"
        env:
          TEST_DATABASE_URL: postgresql://zhu_jia:ci-test-password@localhost:5432/zhu_jia_test
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://zhu_jia:ci-test-password@localhost:5432/zhu_jia_test
          TEST_MIGRATION_TARGET_DATABASE: postgresql://zhu_jia:ci-test-password@localhost:5432/zhu_jia_migration
          TEST_POSTGRES_MAJOR: ${{ matrix.postgres }}
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - storage: embedded
            postgres: 18
          - storage: external
            postgres: 18
          - storage: external
            postgres: 17
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_DB: zhu_jia_ci
          POSTGRES_USER: zhu_jia
          POSTGRES_PASSWORD: ci-test-password
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U zhu_jia -d zhu_jia_ci" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ORIGIN: http://renovation.example.test
      DATABASE_URL: postgresql://zhu_jia:ci-test-password@host.docker.internal:5432/zhu_jia_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate Compose modes
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.external.yaml config --quiet
          DATA_DIR=/tmp/zhu-jia docker compose -f compose.yaml -f compose.bind.yaml config --quiet
          docker compose -f compose.yaml -f compose.image.yaml config --quiet
      - name: Build and start
        run: |
          files=(-f compose.yaml)
          if [ '${{ matrix.storage }}' = external ]; then files+=(-f compose.external.yaml); fi
          docker compose "${files[@]}" up -d --build --wait --wait-timeout 180
      - name: Verify PostgreSQL major version
        if: matrix.storage == 'external'
        run: |
          version=$(PGPASSWORD=ci-test-password psql -h 127.0.0.1 -p 5432 -U zhu_jia -d zhu_jia_ci -Atc "SHOW server_version_num")
          test "$((version / 10000))" -eq "${{ matrix.postgres }}"
      - name: Verify image version and runtime user
        run: |
          test "$(docker image inspect zhu-jia-web:0.9.17 --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = 0.9.17
          files=(-f compose.yaml)
          if [ '${{ matrix.storage }}' = external ]; then files+=(-f compose.external.yaml); fi
          test "$(docker compose "${files[@]}" exec -T app id -u)" = 1000
      - name: Verify image defaults without DATABASE_URL
        if: matrix.storage == 'embedded'
        run: |
          trap 'docker rm -f zhu-jia-defaults >/dev/null 2>&1 || true; docker volume rm zhu-jia-defaults-data >/dev/null 2>&1 || true' EXIT
          docker run -d --name zhu-jia-defaults \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            -v zhu-jia-defaults-data:/app/data \
            -e APP_ORIGIN=http://127.0.0.1:18080 \
            -p 127.0.0.1:18080:3001 \
            zhu-jia-web:0.9.17
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:18080/api/v1/health -o /tmp/health.json; then break; fi
            sleep 2
          done
          node -e "const h = require('/tmp/health.json'); if (h.data.status !== 'ok' || h.data.version !== '0.9.17') process.exit(1)"
      - run: node scripts/docker-smoke.mjs
        env:
          SMOKE_ALLOW_WRITE: "yes"
          SMOKE_ORIGIN: http://renovation.example.test
      - name: Verify the host Nginx reverse proxy example
        if: matrix.storage == 'embedded'
        run: |
          docker run --rm --network host -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:stable-alpine nginx -t
          docker run -d --name zhu-jia-proxy --network host -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:stable-alpine
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1/api/v1/health > /dev/null; then break; fi
            sleep 1
          done
          node scripts/docker-smoke.mjs
        env:
          SMOKE_ALLOW_WRITE: "yes"
          SMOKE_ORIGIN: http://renovation.example.test
          SMOKE_URL: http://127.0.0.1
      - name: Remove the disposable proxy
        if: always() && matrix.storage == 'embedded'
        run: docker rm -f zhu-jia-proxy || true
      - name: Show logs on failure
        if: failure()
        run: |
          files=(-f compose.yaml)
          if [ '${{ matrix.storage }}' = external ]; then files+=(-f compose.external.yaml); fi
          docker compose "${files[@]}" logs --tail 100
      - name: Remove disposable CI containers and volumes
        if: always()
        run: |
          files=(-f compose.yaml)
          if [ '${{ matrix.storage }}' = external ]; then files+=(-f compose.external.yaml); fi
          docker compose "${files[@]}" down -v --remove-orphans
