name: Verify published image
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published application image version"
        required: true
        default: "0.9.6"
      postgres:
        description: "PostgreSQL major version"
        required: true
        type: choice
        options: ["18", "17"]
        default: "18"
permissions:
  contents: read
  packages: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_IMAGE_TAG: ${{ inputs.version }}
      APP_ORIGIN: http://renovation.example.test
      POSTGRES_PASSWORD: "ci:published@image/password%#"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Select database and validate version
        env:
          DATABASE_MAJOR: ${{ inputs.postgres }}
        run: |
          [[ "$APP_IMAGE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          case "$DATABASE_MAJOR" in
            17) echo 'COMPOSE_FILE=compose.yaml:compose.image.yaml:compose.postgres17.yaml' >> "$GITHUB_ENV" ;;
            18) echo 'COMPOSE_FILE=compose.yaml:compose.image.yaml:compose.postgres.yaml' >> "$GITHUB_ENV" ;;
            *) exit 1 ;;
          esac
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker compose up -d --no-build --wait --wait-timeout 180
      - name: Verify actual PostgreSQL version and persistent storage
        env:
          DATABASE_MAJOR: ${{ inputs.postgres }}
        run: |
          actual=$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SHOW server_version_num"')
          test "$((actual / 10000))" -eq "$DATABASE_MAJOR"
          if [ "$DATABASE_MAJOR" = 18 ]; then
            directory=$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SHOW data_directory"')
            test "$directory" = /var/lib/postgresql/18/docker
          fi
          docker compose stop app
          docker compose exec -T db sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "CREATE TABLE persistence_probe (id integer PRIMARY KEY); INSERT INTO persistence_probe VALUES (18);"'
          docker compose up -d --no-deps --force-recreate --wait --wait-timeout 120 db
          value=$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT id FROM persistence_probe"')
          test "$value" = 18
          docker compose up -d --no-build --wait --wait-timeout 180 app
      - run: node scripts/docker-smoke.mjs
        env:
          SMOKE_ALLOW_WRITE: "yes"
          SMOKE_ORIGIN: http://renovation.example.test
          SMOKE_EXPECTED_VERSION: ${{ inputs.version }}
      - name: Verify backup and restore with the selected PostgreSQL client
        env:
          DATABASE_MAJOR: ${{ inputs.postgres }}
        run: |
          BACKUP_DIR="$RUNNER_TEMP/backups" sh scripts/backup-postgres.sh /dev/null "$DATABASE_MAJOR"
          archive=$(find "$RUNNER_TEMP/backups" -name '*.dump' -type f)
          test -n "$archive"
          docker compose exec -T db sh -c 'createdb -U "$POSTGRES_USER" zhu_jia_restore_check'
          docker compose exec -T db sh -c 'pg_restore -U "$POSTGRES_USER" --no-owner --no-privileges --dbname=zhu_jia_restore_check' < "$archive"
          value=$(docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d zhu_jia_restore_check -Atc "SELECT id FROM persistence_probe"')
          test "$value" = 18
      - name: Diagnostics
        if: failure()
        run: docker compose logs --tail 100
      - name: Cleanup disposable validation data
        if: always()
        run: docker compose down -v --remove-orphans
