name: Publish container image
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch, tag, or commit to build"
        required: true
        default: "main"
permissions:
  contents: read
concurrency:
  group: publish-image-${{ inputs.source_ref || github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      image: ${{ steps.metadata.outputs.image }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - id: metadata
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ "$EVENT_NAME" = push ] && [ "$REF_NAME" != "v$version" ]; then
            echo 'Tag and package.json version must match.' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: APP_VERSION=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.source_sha }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}
      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error
  candidate:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      actions: read
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Assemble candidate for both architectures
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          images=()
          for file in "$RUNNER_TEMP"/digests/*; do
            digest=$(basename "$file")
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            images+=("$IMAGE@sha256:$digest")
          done
          test "${#images[@]}" -eq 2
          docker buildx imagetools create -t "$IMAGE:sha-$SOURCE_SHA" "${images[@]}"
  verify:
    needs: [prepare, candidate]
    strategy:
      matrix:
        storage: [embedded, postgres]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      APP_ORIGIN: https://renovation.example.test
      APP_IMAGE: ${{ needs.prepare.outputs.image }}
      APP_IMAGE_TAG: sha-${{ needs.prepare.outputs.source_sha }}
      POSTGRES_PASSWORD: "ci:test@password/with%characters#"
    steps:
      # Deployment definitions belong to the workflow revision; application code is pinned above.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and start the candidate image
        run: |
          files=(-f compose.yaml -f compose.image.yaml)
          if [ '${{ matrix.storage }}' = postgres ]; then files+=(-f compose.postgres.yaml); fi
          docker compose "${files[@]}" up -d --no-build --wait --wait-timeout 180
      - run: node scripts/docker-smoke.mjs
        env:
          SMOKE_ALLOW_WRITE: "yes"
          SMOKE_ORIGIN: https://renovation.example.test
          SMOKE_EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
      - name: Diagnostics
        if: failure()
        run: docker compose -f compose.yaml -f compose.image.yaml -f compose.postgres.yaml logs --tail 100
      - name: Cleanup disposable CI data
        if: always()
        run: docker compose -f compose.yaml -f compose.image.yaml -f compose.postgres.yaml down -v --remove-orphans
  publish:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote verified image to the version tag
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE:sha-$SOURCE_SHA"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          {
            echo '### Published image'
            echo "\`$IMAGE:$VERSION\`"
            echo ''
            echo 'Platforms: linux/amd64, linux/arm64. Embedded and PostgreSQL HTTP checks passed.'
            echo "Source commit: $SOURCE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
